[workspace]
resolver = "2"
members = [
  "trakktor_core",
]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
boa_engine = "0.21.0"
boa_runtime = "0.21.0"
boa_gc = "0.21.0"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures-lite = "2.6"
futures-concurrency = "7.6"
bon = "3"
reqwest = { version = "0.13", features = [
  "rustls", "json", "gzip", "brotli", "zstd"] }
ratatui = "0.30.0"
color-eyre = "0.6"
crossterm = { version = "0.29", features = ["event-stream"] }
textwrap = { version = "0.16", features = ["smawk"]}
log = { version = "0.4", features = ["kv", "std"] }
mime_guess = "2.0"
bytesize = "2.3"
termbg = "0.6"

[profile.dev]
debug = true

[profile.release]
lto = true
codegen-units = 1
