[workspace]
resolver = "2"
members = [
  "dev_boa", "trakktor_core",
]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
boa_engine = "0.21.0"
boa_runtime = "0.21.0"
tokio = { version = "1", features = ["full"] }
futures-lite = "2.6"
futures-concurrency = "7.6"
bon = "3"
reqwest = { version = "0.13", features = [
  "rustls", "json", "gzip", "brotli", "zstd"] }

[profile.dev]
debug = true

[profile.release]
lto = true
codegen-units = 1
