# Cargo workspace for trakktor: a thin CLI binary (`trakktor`) over a
# reusable library (`trakktor_core`).
[workspace]
resolver = "3"
members = ["trakktor", "trakktor_core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
trakktor_core = { path = "trakktor_core" }

# Shared third-party dependencies, declared once for every workspace member.
base64 = "0.22"
blake3 = "1"
# The alternative GigaAM runtime: ndarray on the CPU, wgpu with MSL-compiled
# kernels on Metal, with operator fusion and autotuning.
burn = { version = "0.21", default-features = false, features = [
    "std",
    "ndarray",
    "metal",
    "fusion",
    "autotune",
] }
candle-core = "0.11"
candle-nn = "0.11"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
feedparser-rs = { version = "0.5", default-features = false }
# Pure-Rust audio encoders for the VAD editing feature: WAV (hound) and FLAC
# (flacenc). flacenc's defaults pull rayon/log/serde we do not need.
flacenc = { version = "0.5", default-features = false }
flate2 = "1"
hound = "3"
# Reading NeMo `.nemo` archives (a plain or gzip tar) to extract the model
# weights for `text punctuate`.
tar = "0.4"
md-5 = "0.10"
rand = "0.9"
realfft = "3"
reqwest = { version = "0.13", features = [
    "blocking",
    "gzip",
    "deflate",
    "brotli",
] }
rustc-hash = "2"
scraper = "0.27"
serde_json = { version = "1", features = [
    "preserve_order",
    # Correctly rounded float parsing: differential tests compare f64 values
    # against reference dumps bit for bit.
    "float_roundtrip",
] }
# Default features (flac/ogg/vorbis/wav/pcm/adpcm/mkv + metadata + SIMD) plus
# the codecs and containers common for speech recordings.
symphonia = { version = "0.6", features = [
    "aac",
    "alac",
    "mp3",
    "isomp4",
    "aiff",
    "caf",
] }
thiserror = "2"
tiktoken-rs = { version = "0.12", default-features = false }
# XLM-RoBERTa tokenizer for `text structify` (SaT). `fancy-regex` (pure Rust)
# stands in for the default `onig` C dependency; the XLM-R tokenizer uses a
# Metaspace pre-tokenizer, so the regex engine is only a compile-time need.
tokenizers = { version = "0.22", default-features = false, features = [
    "fancy-regex",
] }
url = "2"
# Reading the published `silero-stress` model, which is a `torch.package`
# archive (a ZIP); only the pure-Rust deflate path is needed.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
