# trakktor_core: reusable implementation of all trakktor features,
# independent of the CLI.
[package]
name = "trakktor_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = [
    "whisper-runtime",
    "gigaam-runtime",
    "vosk-runtime",
    "audio",
    "vad",
    "structify-runtime",
    "punctuate-runtime",
    "stress-runtime",
    "tts-runtime",
    "ocr-runtime",
]
# Built-in audio decoding (symphonia), the sample-rate/channel conversion
# pipeline, and the WAV/FLAC encoders. Off the default set the crate builds
# without media support.
audio = ["dep:symphonia", "dep:hound", "dep:flacenc"]
# The candle-backed Whisper runtime. Off the default set this crate builds
# without the ML stack (feeds/skill only).
whisper-runtime = ["dep:candle-core", "dep:candle-nn", "dep:serde_json"]
# The burn-backed alternative Whisper runtime, selectable at run time next to
# the candle one. Builds on top of the candle runtime (shared checkpoint
# reader and model plumbing).
whisper-burn = ["whisper-runtime", "dep:burn"]
# The candle-backed GigaAM runtime (Conformer encoder + CTC/RNN-T heads). Off
# the default set this crate builds without the GigaAM stack.
gigaam-runtime = ["dep:candle-core", "dep:candle-nn", "dep:serde_json"]
# The burn-backed alternative GigaAM runtime, selectable at run time next to
# the candle one. Builds on top of the candle runtime (shared checkpoint
# reader and model plumbing).
gigaam-burn = ["gigaam-runtime", "dep:burn"]
# The candle-backed Vosk runtime (Zipformer2 transducer, offline and
# streaming models). Off the default set this crate builds without it.
vosk-runtime = ["dep:candle-core", "dep:candle-nn", "dep:serde_json"]
# The burn-backed alternative Vosk runtime, selectable at run time next to
# the candle one. Builds on top of the candle runtime (shared weight
# extraction and model plumbing).
vosk-burn = ["vosk-runtime", "dep:burn"]
# Silero voice-activity detection: an engine-independent speech-preprocessing
# stage over ASR. Needs candle (the model runs on the CPU). Off the default set
# the crate builds without VAD.
vad = ["dep:candle-core", "dep:candle-nn"]
# The candle-backed SaT (XLM-RoBERTa) runtime for `text structify`: text
# structuring into paragraphs. Needs candle and the XLM-R tokenizer. Off the
# default set the crate builds without it.
structify-runtime = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:serde_json",
    "dep:tokenizers",
]
# The burn-backed alternative SaT runtime, selectable at run time next to the
# candle one. Builds on top of the candle runtime (shared checkpoint reader
# and model plumbing).
structify-burn = ["structify-runtime", "dep:burn"]
# The candle-backed punctuation/truecasing runtime for `text punctuate`: an
# XLM-RoBERTa encoder with cascaded classification heads (punctuation,
# truecasing, sentence boundaries). Needs candle, the `tokenizers` crate (its
# own SentencePiece model), and `tar` (extracting the weights from the NeMo
# archive). Off the default set the crate builds without it.
punctuate-runtime = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:tokenizers",
    "dep:tar",
]
# The burn-backed alternative punctuate runtime, selectable at run time next to
# the candle one. Builds on top of the candle runtime (shared checkpoint reader
# and model plumbing).
punctuate-burn = ["punctuate-runtime", "dep:burn"]
# The candle-backed runtime for `text stress`: the n-gram accentor and the
# BERT homograph solver of silero-stress. Needs candle, the `tokenizers` crate
# (the model's own word-piece vocabulary), and `zip` (the published model is a
# `torch.package` archive, read once at install). Off the default set the crate
# builds without it.
stress-runtime = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:tokenizers",
    "dep:zip",
]
# The burn-backed alternative stress runtime, selectable at run time next to
# the candle one. Builds on top of the candle runtime (shared model conversion
# and pipeline).
stress-burn = ["stress-runtime", "dep:burn"]
# The candle-backed speech-synthesis runtimes (`tts qwen3-tts`, `tts espeech`,
# `tts silero`). Needs candle, the `tokenizers` crate (Qwen3-TTS ships its
# byte-level BPE as raw vocab/merges), `zip` (Silero publishes a `torch.package`
# archive, read once at install), and the audio encoders for writing the
# result. Off the default set the crate builds without it.
tts-runtime = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:serde_json",
    "dep:tokenizers",
    "dep:zip",
    "audio",
]
# The burn-backed alternative Qwen3-TTS runtime, selectable at run time next to
# the candle one. Builds on top of the candle runtime (shared checkpoint reader
# and model plumbing).
tts-burn = ["tts-runtime", "dep:burn"]
# The candle-backed OCR runtime (`ocr paddle`): text detection, text-line
# orientation classification and text recognition, reading PaddleOCR's own
# inference artifacts. Needs candle, `image` for decoding the page, `imageproc`
# and `clipper2-rust` for the geometry around the networks. Off the default set
# the crate builds without it.
ocr-runtime = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:serde_json",
    "dep:image",
    "dep:imageproc",
    "dep:clipper2-rust",
]
# The burn-backed alternative OCR runtime, selectable at run time next to the
# candle one. Builds on top of the candle runtime (shared artifact reader and
# model plumbing).
ocr-burn = ["ocr-runtime", "dep:burn"]
# GPU acceleration for the Whisper runtime.
whisper-metal = ["whisper-runtime", "candle-core/metal", "candle-nn/metal"]
whisper-cuda = ["whisper-runtime", "candle-core/cuda", "candle-nn/cuda"]
# GPU acceleration for the GigaAM runtime.
gigaam-metal = ["gigaam-runtime", "candle-core/metal", "candle-nn/metal"]
gigaam-cuda = ["gigaam-runtime", "candle-core/cuda", "candle-nn/cuda"]
# GPU acceleration for the Vosk runtime.
vosk-metal = ["vosk-runtime", "candle-core/metal", "candle-nn/metal"]
vosk-cuda = ["vosk-runtime", "candle-core/cuda", "candle-nn/cuda"]
# GPU acceleration for the structify runtime.
structify-metal = ["structify-runtime", "candle-core/metal", "candle-nn/metal"]
structify-cuda = ["structify-runtime", "candle-core/cuda", "candle-nn/cuda"]
# GPU acceleration for the punctuate runtime.
punctuate-metal = ["punctuate-runtime", "candle-core/metal", "candle-nn/metal"]
punctuate-cuda = ["punctuate-runtime", "candle-core/cuda", "candle-nn/cuda"]
# GPU acceleration for the stress runtime.
stress-metal = ["stress-runtime", "candle-core/metal", "candle-nn/metal"]
stress-cuda = ["stress-runtime", "candle-core/cuda", "candle-nn/cuda"]
# GPU acceleration for the Qwen3-TTS runtime.
tts-metal = ["tts-runtime", "candle-core/metal", "candle-nn/metal"]
tts-cuda = ["tts-runtime", "candle-core/cuda", "candle-nn/cuda"]
# GPU acceleration for the OCR runtime.
ocr-metal = ["ocr-runtime", "candle-core/metal", "candle-nn/metal"]
ocr-cuda = ["ocr-runtime", "candle-core/cuda", "candle-nn/cuda"]

[dependencies]
base64.workspace = true
blake3.workspace = true
burn = { workspace = true, optional = true }
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
chrono.workspace = true
# clap is used only to introspect the CLI definition (`Command`) when rendering
# the skill — the single source of truth for commands/flags.
clap.workspace = true
clipper2-rust = { workspace = true, optional = true }
feedparser-rs.workspace = true
flacenc = { workspace = true, optional = true }
flate2.workspace = true
hound = { workspace = true, optional = true }
image = { workspace = true, optional = true }
imageproc = { workspace = true, optional = true }
# One of the two digests the shared downloader verifies models against (blake3
# is the other): which one to expect is the publisher's choice, not a feature.
md-5.workspace = true
rand.workspace = true
realfft.workspace = true
reqwest.workspace = true
rustc-hash.workspace = true
scraper.workspace = true
serde_json = { workspace = true, optional = true }
symphonia = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
thiserror.workspace = true
tiktoken-rs.workspace = true
tokenizers = { workspace = true, optional = true }
url.workspace = true
zip = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"
