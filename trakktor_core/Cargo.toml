# trakktor_core: reusable implementation of all trakktor features,
# independent of the CLI. See architecture.md and ADR-0002.
[package]
name = "trakktor_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
blake3.workspace = true
chrono.workspace = true
# clap is used only to introspect the CLI definition (`Command`) when rendering
# the skill — the single source of truth for commands/flags (ADR-0003).
clap.workspace = true
feedparser-rs.workspace = true
realfft.workspace = true
reqwest.workspace = true
rustc-hash.workspace = true
scraper.workspace = true
thiserror.workspace = true
tiktoken-rs.workspace = true
url.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"
