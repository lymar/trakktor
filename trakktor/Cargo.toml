# trakktor: the CLI binary. A thin layer over trakktor_core that parses
# arguments, resolves configuration, and formats output.
[package]
name = "trakktor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# GPU acceleration on macOS for `asr` and `text structify` (`--device metal`).
metal = [
    "trakktor_core/whisper-metal",
    "trakktor_core/gigaam-metal",
    "trakktor_core/structify-metal",
]

[[bin]]
name = "trakktor"
path = "src/main.rs"

[dependencies]
trakktor_core.workspace = true
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
