# trakktor: the CLI binary. A thin layer over trakktor_core that parses
# arguments, resolves configuration, and formats output.
[package]
name = "trakktor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# GPU acceleration on macOS for `asr`, `text structify`, `text punctuate`, and
# `tts` (`--device metal`).
metal = [
    "trakktor_core/whisper-metal",
    "trakktor_core/gigaam-metal",
    "trakktor_core/vosk-metal",
    "trakktor_core/structify-metal",
    "trakktor_core/punctuate-metal",
    "trakktor_core/tts-metal",
]
# The burn runtime for `asr whisper`, `asr gigaam`, `asr vosk`, `text
# structify`, and `text punctuate` (`--runtime burn`), with its own CPU and
# Metal backends.
burn = [
    "trakktor_core/whisper-burn",
    "trakktor_core/gigaam-burn",
    "trakktor_core/vosk-burn",
    "trakktor_core/structify-burn",
    "trakktor_core/punctuate-burn",
]

[[bin]]
name = "trakktor"
path = "src/main.rs"

[dependencies]
trakktor_core.workspace = true
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
