# trakktor: the CLI binary. A thin layer over trakktor_core that parses
# arguments, resolves configuration, and formats output. See architecture.md.
[package]
name = "trakktor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "trakktor"
path = "src/main.rs"

[dependencies]
trakktor_core.workspace = true
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
